<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings - Chambú Kitchen &amp; Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Libre+Caslon+Text:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="assets/css/tailwind.css" rel="stylesheet"/>
<link href="assets/css/styles.css" rel="stylesheet"/>
</head>
<body class="bg-background text-on-background font-body-md h-screen overflow-hidden flex flex-col md:flex-row">
<!-- TopNavBar (Mobile, injected by assets/js/app.js) -->
<div data-layout-topbar></div>
<!-- SideNavBar (Desktop, injected by assets/js/app.js) -->
<div data-layout-sidebar></div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col h-full bg-background relative overflow-hidden">
<!-- Header / Toolbar -->
<div class="px-margin-mobile md:px-margin-desktop py-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-outline-variant/10 bg-background z-10">
<div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-1">Settings</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Configure business details and billing defaults.</p>
</div>
</div>
<!-- Settings Body -->
<div class="flex-1 overflow-y-auto px-margin-mobile md:px-margin-desktop py-8">
<div class="max-w-2xl mx-auto">
<form class="glass-panel rounded-xl border border-outline-variant/10 p-6 space-y-6" data-settings-form novalidate>
<div>
<h2 class="font-title-lg text-title-lg text-primary mb-1 flex items-center gap-2"><span class="material-symbols-outlined">storefront</span> Business</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-4">Shown in the app header and printed tickets.</p>
<label class="block">
<span class="font-label-md text-label-md text-on-surface-variant block mb-2">Restaurant name</span>
<input class="w-full bg-surface-container-high border border-outline-variant/30 rounded-lg px-3 py-2 text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary-container transition-colors" name="restaurant" type="text" placeholder="Chambú Kitchen &amp; Bar"/>
</label>
</div>
<div>
<h2 class="font-title-lg text-title-lg text-primary mb-1 flex items-center gap-2"><span class="material-symbols-outlined">percent</span> Billing</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-4">Applied automatically to every ticket in the POS.</p>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<label class="block">
<span class="font-label-md text-label-md text-on-surface-variant block mb-2">Tax rate (%)</span>
<input class="w-full bg-surface-container-high border border-outline-variant/30 rounded-lg px-3 py-2 text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary-container transition-colors" name="tax" type="number" min="0" step="0.1" placeholder="8.5"/>
</label>
<label class="block">
<span class="font-label-md text-label-md text-on-surface-variant block mb-2">Service charge (%)</span>
<input class="w-full bg-surface-container-high border border-outline-variant/30 rounded-lg px-3 py-2 text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary-container transition-colors" name="service" type="number" min="0" step="0.1" placeholder="18"/>
</label>
</div>
</div>
<div class="border-t border-outline-variant/10 pt-4 flex flex-col sm:flex-row justify-end gap-3">
<button class="bg-transparent border border-outline-variant hover:border-error text-on-surface font-label-md text-label-md py-3 px-5 rounded-lg uppercase tracking-wider transition-colors" type="button" id="btnResetSettings">
                            Reset defaults
                        </button>
<button class="bg-primary-container text-on-primary-container hover:bg-primary-fixed font-label-md text-label-md py-3 px-8 rounded-lg uppercase tracking-wider transition-colors font-bold shadow-lg" type="submit">
<span class="material-symbols-outlined text-[18px] inline-block align-middle mr-1">save</span>
                            Save settings
                        </button>
</div>
</form>
</div>
</div>
</main>
<script src="assets/js/app.js"></script>
</body></html>
